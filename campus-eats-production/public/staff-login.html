<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Staff Sign In — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--g);font-family:'Work Sans';display:grid;place-items:center;padding:16px}.wrap{width:min(100%,430px)}.brand{text-align:center;color:white;font:700 24px Oswald;text-transform:uppercase;letter-spacing:2px;margin-bottom:18px}.brand span{color:var(--y)}.card{background:white;border-radius:15px;padding:28px 23px;border-top:5px solid var(--r)}h1{font:700 30px Oswald;text-transform:uppercase;margin:0 0 6px}.sub{font-size:14px;line-height:1.5;opacity:.7}label{display:block;font:600 12px Oswald;text-transform:uppercase;margin:18px 0 6px}input{width:100%;padding:13px;border:1.5px solid #d7d0c4;border-radius:9px;font-size:16px}.btn{width:100%;min-height:49px;margin-top:16px;border:0;border-radius:9px;background:var(--r);color:white;font:700 15px Oswald;text-transform:uppercase}.msg{display:none;margin-top:12px;padding:11px;border-radius:8px;background:#fff0ed;color:#8d2e20}.msg.show{display:block}.back{display:block;text-align:center;color:var(--y);text-decoration:none;margin-top:18px;font-size:13px}</style><link rel="stylesheet" href="mobile.css"></head><body><main class="wrap"><div class="brand">Campus <span>Eats</span> · Staff</div><section class="card"><h1>Staff portal</h1><p class="sub">Enter the shift passcode. On the next screen, choose your runner name and enable browser notifications on this device.</p><form id="f"><label>Shift passcode</label><input id="pass" type="password" autocomplete="off" required><div id="err" class="msg"></div><button id="go" class="btn">Continue</button></form></section><a class="back" href="index.html">← Customer website</a></main><script>f.onsubmit=async e=>{e.preventDefault();err.classList.remove('show');go.disabled=true;try{const r=await fetch('/api/auth/staff/demo-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:pass.value.trim()})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Sign in failed');sessionStorage.setItem('campusEatsStaffToken',d.token);location.href='staff-notifications.html'}catch(x){err.textContent=x.message;err.classList.add('show')}finally{go.disabled=false}};</script></body></html>
