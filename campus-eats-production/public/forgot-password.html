<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reset Password — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Work Sans';color:var(--i)}header{background:var(--g);border-bottom:3px solid var(--y);padding:15px 18px}.nav{max-width:980px;margin:auto;display:flex;justify-content:space-between;gap:12px}.nav a{color:white;text-decoration:none;font:700 18px Oswald}.nav a:last-child{color:var(--y);font-size:14px}.wrap{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px 12px}.card{width:min(100%,470px);background:white;border-radius:15px;padding:28px 24px;box-shadow:0 10px 30px #2b24181c;border-top:5px solid var(--r)}h1{font:700 32px Oswald;text-transform:uppercase;margin:4px 0 8px}.sub,.note{font-size:14px;line-height:1.55}.sub{opacity:.78}.note{background:#f7f2e5;padding:12px;border-radius:9px;margin:15px 0}label{display:block;font:600 12px Oswald;text-transform:uppercase;color:var(--g);margin:14px 0 6px}input{width:100%;padding:13px;border:1.5px solid #d7d0c4;border-radius:9px;background:#faf8f2;font-size:16px}.btn{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:9px;background:var(--r);color:white;font:700 15px Oswald;text-transform:uppercase}.secondary{background:var(--g)}.msg{display:none;margin:12px 0;padding:11px;border-radius:8px;font-size:13px}.msg.show{display:block}.bad{background:#fff0ed;color:#8d2e20}.ok{background:#edf7ef;color:#24562d}.reset{display:none}.reset.show{display:block}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="nav"><a href="index.html">Campus Eats</a><a href="login.html">Back to sign in</a></div></header><main class="wrap"><section class="card"><h1>Reset password</h1><p class="sub">Request a one-time six-digit reset code, then choose a new password.</p><div class="note"><b>Pilot recovery method:</b> the code is sent through Campus Eats browser notifications to devices where you previously enabled customer notifications. Codes expire after 10 minutes.</div><div id="msg" class="msg"></div><form id="requestForm"><label>Email address</label><input id="email" type="email" autocomplete="email" required><button id="sendCode" class="btn" type="submit">Send reset code</button></form><form id="resetForm" class="reset"><label>6-digit code</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><label>New password</label><input id="newPass" type="password" minlength="8" autocomplete="new-password" required><label>Confirm new password</label><input id="confirmPass" type="password" minlength="8" autocomplete="new-password" required><button id="resetBtn" class="btn secondary" type="submit">Update password</button></form></section></main><script>const email=document.getElementById('email'),requestForm=document.getElementById('requestForm'),resetForm=document.getElementById('resetForm'),msg=document.getElementById('msg'),sendCode=document.getElementById('sendCode'),resetBtn=document.getElementById('resetBtn'),code=document.getElementById('code'),newPass=document.getElementById('newPass'),confirmPass=document.getElementById('confirmPass');const q=new URLSearchParams(location.search).get('email');if(q)email.value=q;function show(text,type='ok'){msg.textContent=text;msg.className='msg show '+type}requestForm.onsubmit=async e=>{e.preventDefault();sendCode.disabled=true;try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim().toLowerCase()})}),d=await r.json();show(d.message||'If the account can receive notifications, a reset code has been sent.');resetForm.classList.add('show');code.focus()}catch(x){show('Could not request a reset code. Please try again.','bad')}finally{sendCode.disabled=false}};resetForm.onsubmit=async e=>{e.preventDefault();if(newPass.value!==confirmPass.value)return show('The two new passwords do not match.','bad');if(newPass.value.length<8)return show('Password must be at least 8 characters.','bad');resetBtn.disabled=true;try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim().toLowerCase(),code:code.value.trim(),newPassword:newPass.value})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not reset password');show(d.message||'Password updated.');setTimeout(()=>location.href='login.html',1200)}catch(x){show(x.message,'bad')}finally{resetBtn.disabled=false}};</script></body></html>
