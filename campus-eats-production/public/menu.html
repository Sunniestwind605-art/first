<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Menu — Campus Eats | Tubatsi Grill House</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--hunter:#1F3823;--brick:#A8412C;--brick-dark:#8f371f;--parch:#EFE9DA;--gold:#C9A227;--ink:#2B2418;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--parch);color:var(--ink);font-family:'Work Sans',sans-serif}.navbar{position:sticky;top:0;z-index:30;background:var(--hunter);border-bottom:3px solid var(--gold);padding:14px 18px}.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:16px}.brand{font:700 20px 'Oswald';letter-spacing:1.4px;text-transform:uppercase;color:white;text-decoration:none;margin-right:auto}.nav a:not(.brand){font:600 13px 'Oswald';text-transform:uppercase;color:white;text-decoration:none}.hero{background:linear-gradient(135deg,var(--hunter),#24432a);color:white;text-align:center;padding:36px 16px 26px}.hero .flame{font-size:42px}.hero h1{margin:5px 0;font:700 clamp(30px,8vw,42px) 'Oswald';text-transform:uppercase;letter-spacing:2px;background:linear-gradient(90deg,var(--gold),var(--brick));-webkit-background-clip:text;color:transparent}.hero p{margin:6px 0;color:var(--parch)}.tools{position:sticky;top:62px;z-index:20;background:var(--hunter);padding:10px 12px}.tools-inner{max-width:1000px;margin:auto;display:flex;gap:8px;overflow:auto;scrollbar-width:none}.tools input{min-width:220px;flex:1;padding:11px 14px;border:0;border-radius:22px;font-size:16px}.cat{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:white;border-radius:20px;padding:8px 12px;white-space:nowrap;font:600 12px 'Oswald';text-transform:uppercase}.wrap{max-width:1000px;margin:auto;padding:28px 14px 100px}.category{margin:0 0 32px}.banner{background:linear-gradient(90deg,var(--brick),var(--gold));color:white;padding:10px 16px;border-radius:8px;font:700 18px 'Oswald';text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.item{background:white;border-radius:10px;padding:14px 15px;border-left:4px solid var(--brick);box-shadow:0 2px 7px rgba(43,36,24,.08);display:flex;flex-direction:column;min-width:0}.top{display:flex;justify-content:space-between;gap:10px}.item h3{margin:0;font:600 16px 'Oswald'}.price{font:700 16px 'Oswald';color:var(--brick);white-space:nowrap}.desc{font-size:13px;opacity:.7;margin:6px 0;line-height:1.35}.add{align-self:flex-start;margin-top:auto;border:0;border-radius:18px;padding:8px 14px;background:var(--brick);color:white;font:700 12px 'Oswald';cursor:pointer}.cartbar{position:fixed;z-index:45;left:14px;right:14px;bottom:max(12px,env(safe-area-inset-bottom));max-width:520px;margin:auto;background:var(--brick);color:white;border:0;border-radius:28px;padding:14px 20px;font:700 15px 'Oswald';box-shadow:0 5px 20px #0004;display:none}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:60}.overlay.open{display:block}.cart{position:absolute;right:0;top:0;height:100%;width:min(420px,100%);background:white;padding:18px;overflow:auto}.cart-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;font-size:30px}.line{padding:12px 0;border-bottom:1px solid #eee;display:grid;grid-template-columns:1fr auto;gap:8px}.qty button{width:30px;height:30px;border:0;border-radius:50%;background:var(--hunter);color:white}.checkout{width:100%;margin-top:16px;border:0;border-radius:9px;background:var(--brick);color:white;padding:14px;font:700 15px 'Oswald'}@media(max-width:640px){.nav{gap:10px}.nav a:not(.brand){font-size:11px}.grid{grid-template-columns:1fr}.wrap{padding-left:10px;padding-right:10px}.tools{top:59px}.item{padding:13px}.hero{padding-top:28px}}</style><link rel="stylesheet" href="mobile.css"></head><body><header class="navbar"><div class="nav"><a class="brand" href="index.html">Campus Eats</a><a href="order-tracking.html">Track</a><a href="login.html">Sign in</a></div></header><section class="hero"><span class="flame">🔥</span><h1>Tubatsi Grill House</h1><p>Original Campus Eats menu experience · order for Wits Main Campus delivery</p></section><div class="tools"><div class="tools-inner"><input id="search" placeholder="Search the Tubatsi menu…"><button class="cat" data-cat="all">All</button><button class="cat" data-cat="breakfast">Breakfast</button><button class="cat" data-cat="burger">Burgers</button><button class="cat" data-cat="kota">Kotas</button><button class="cat" data-cat="combo">Combos</button><button class="cat" data-cat="wors">Wors</button><button class="cat" data-cat="other">More</button></div></div><main class="wrap" id="menu"></main><button id="cartBar" class="cartbar">🛒 View cart · <span id="cartCount">0</span> items · <span id="cartTotal">R0.00</span></button><div class="overlay" id="overlay"><aside class="cart"><div class="cart-head"><h2 style="font-family:Oswald">Your order</h2><button class="close" id="close">×</button></div><div id="cartLines"></div><div style="display:flex;justify-content:space-between;padding-top:14px;font-weight:700"><span>Subtotal</span><span id="subtotal">R0.00</span></div><button class="checkout" id="checkout">Continue to checkout</button></aside></div><script>let items=[],active='all';let cart=JSON.parse(localStorage.getItem('campusEatsCartV2')||'{}');const money=c=>'R'+(Number(c||0)/100).toFixed(2);function group(n){n=n.toLowerCase();if(/breakfast|egg|bacon/.test(n))return'breakfast';if(/burger/.test(n))return'burger';if(/kota|quarter/.test(n))return'kota';if(/combo|box|meal/.test(n))return'combo';if(/wors/.test(n))return'wors';return'other'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const r=await fetch('/api/catalog/menu'),d=await r.json();items=d.items||[];render();renderCart()}function render(){const q=document.getElementById('search').value.toLowerCase();const filtered=items.filter(x=>(active==='all'||group(x.name)===active)&&x.name.toLowerCase().includes(q));const groups=[['breakfast','Breakfast'],['burger','Burgers'],['kota','Kotas'],['combo','Combos'],['wors','Wors'],['other','More from Tubatsi']];document.getElementById('menu').innerHTML=groups.map(([g,label])=>{const a=filtered.filter(x=>group(x.name)===g);return a.length?`<section class="category"><div class="banner">${label}</div><div class="grid">${a.map(x=>`<article class="item"><div class="top"><h3>${esc(x.name)}</h3><span class="price">${money(x.price_cents)}</span></div>${x.description?`<p class="desc">${esc(x.description)}</p>`:''}<button class="add" onclick="add('${x.id}')">+ Add</button></article>`).join('')}</div></section>`:''}).join('')||'<p>No menu items found.</p>'}function add(id){cart[id]=(cart[id]||0)+1;save()}function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];save()}function save(){localStorage.setItem('campusEatsCartV2',JSON.stringify(cart));renderCart()}function renderCart(){const rows=Object.entries(cart).map(([id,q])=>{const x=items.find(i=>i.id===id);return x?{...x,q}:null}).filter(Boolean);const count=rows.reduce((a,x)=>a+x.q,0),sum=rows.reduce((a,x)=>a+x.price_cents*x.q,0);cartBar.style.display=count?'block':'none';cartCount.textContent=count;cartTotal.textContent=money(sum);subtotal.textContent=money(sum);cartLines.innerHTML=rows.map(x=>`<div class="line"><div><b>${esc(x.name)}</b><br><small>${money(x.price_cents)} each</small></div><div class="qty"><button onclick="change('${x.id}',-1)">−</button> ${x.q} <button onclick="change('${x.id}',1)">+</button></div></div>`).join('')||'<p>Your cart is empty.</p>'}search.oninput=render;document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()});cartBar.onclick=()=>overlay.classList.add('open');close.onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};checkout.onclick=()=>{if(!Object.keys(cart).length)return;localStorage.setItem('campusEatsReturnTo','checkout.html');location.href=localStorage.getItem('campusEatsToken')?'checkout.html':'login.html'};load();</script></body></html>
