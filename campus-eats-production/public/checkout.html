<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Checkout — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Work Sans';color:var(--i)}header{background:var(--g);border-bottom:3px solid var(--y);padding:15px 18px}.nav{max-width:1050px;margin:auto;display:flex;gap:16px}.nav a{color:white;text-decoration:none;font:600 14px Oswald}.nav a:first-child{font-size:19px;margin-right:auto}.wrap{max-width:1000px;margin:auto;padding:30px 14px 60px}.title{font:700 clamp(30px,7vw,44px) Oswald;text-transform:uppercase;margin:0 0 22px}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:18px}.card{background:white;border-radius:14px;padding:22px;box-shadow:0 5px 18px #2b241812}.card h2{font:700 20px Oswald;text-transform:uppercase;margin:0 0 15px;color:var(--g)}label{display:block;font:600 12px Oswald;text-transform:uppercase;margin:14px 0 6px;color:var(--g)}select,input{width:100%;padding:13px;border:1.5px solid #d7d0c4;border-radius:9px;background:#faf8f2;font-size:16px}.line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.totals{margin-top:14px}.total{display:flex;justify-content:space-between;padding:7px 0}.grand{font-weight:700;font-size:18px;border-top:2px solid var(--g);margin-top:8px;padding-top:12px}.btn{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:9px;background:var(--r);color:white;font:700 15px Oswald;text-transform:uppercase}.msg{display:none;padding:12px;border-radius:8px;margin-top:12px}.msg.show{display:block}.bad{background:#fff0ed;color:#8d2e20}.note{font-size:13px;line-height:1.5;background:#f6f2e8;padding:12px;border-radius:8px;margin-top:14px}@media(max-width:760px){.layout{grid-template-columns:1fr}.summary{order:-1}}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="nav"><a href="index.html">Campus Eats</a><a href="menu.html">Menu</a><a href="order-tracking.html">Track</a></div></header><main class="wrap"><h1 class="title">Checkout</h1><div class="layout"><section class="card"><h2>Delivery details</h2><label>Wits Main Campus building</label><select id="building"><option>Loading buildings…</option></select><label>Room / lecture venue / entrance note</label><input id="room" placeholder="e.g. room 204, reception, main entrance"><label>Payment</label><select id="payment"><option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option></select><div class="note">Delivery is currently limited to the Wits Braamfontein Main Campus East and West precincts.</div><div id="err" class="msg bad"></div><button id="place" class="btn">Place order</button></section><aside class="card summary"><h2>Your Tubatsi order</h2><div id="lines"></div><div class="totals"><div class="total"><span>Subtotal</span><b id="sub">R0.00</b></div><div class="total"><span>Service fee</span><b id="fee">R0.00</b></div><div class="total grand"><span>Total</span><b id="total">R0.00</b></div></div></aside></div></main><script>const token=localStorage.getItem('campusEatsToken');if(!token){localStorage.setItem('campusEatsReturnTo','checkout.html');location.href='login.html'}let menu=[],cart=JSON.parse(localStorage.getItem('campusEatsCartV2')||'{}'),buildings=[];const money=c=>'R'+(Number(c||0)/100).toFixed(2),esc=s=>String(s||'').replace(/[&<>]/g,'');function show(m){err.textContent=m;err.classList.add('show')}async function init(){try{const [mr,br]=await Promise.all([fetch('/api/catalog/menu'),fetch('/api/catalog/buildings')]);const md=await mr.json(),bd=await br.json();menu=md.items||[];buildings=bd.buildings||[];building.innerHTML='<option value="">Select a building…</option>'+buildings.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');render()}catch(e){show('Could not load checkout data. Refresh and try again.')}}function rows(){return Object.entries(cart).map(([id,q])=>{const x=menu.find(i=>i.id===id);return x?{...x,q}:null}).filter(Boolean)}function render(){const a=rows();if(!a.length){lines.innerHTML='<p>Your cart is empty. <a href="menu.html">Return to the menu.</a></p>';place.disabled=true;return}lines.innerHTML=a.map(x=>`<div class="line"><span>${x.q}× ${esc(x.name)}</span><b>${money(x.price_cents*x.q)}</b></div>`).join('');const s=a.reduce((n,x)=>n+x.price_cents*x.q,0),f=Math.round(s*.10);sub.textContent=money(s);fee.textContent=money(f);total.textContent=money(s+f)}place.onclick=async()=>{err.classList.remove('show');const items=rows().map(x=>({menuItemId:x.id,quantity:x.q}));if(!building.value)return show('Choose a Wits Main Campus building.');place.disabled=true;place.textContent='Placing order…';try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({buildingId:building.value,roomNumber:room.value.trim(),paymentMethod:payment.value,items})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not place order');localStorage.removeItem('campusEatsCartV2');localStorage.setItem('campusEatsLastOrderId',d.order.id);location.href='order-tracking.html'}catch(e){show(e.message);place.disabled=false;place.textContent='Place order'}};init();</script></body></html>
