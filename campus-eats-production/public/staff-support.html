<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Support Inbox — Campus Eats Staff</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Work Sans';color:var(--i)}header{background:var(--g);border-bottom:3px solid var(--y);padding:13px 16px;position:sticky;top:0;z-index:30}.bar{max-width:1180px;margin:auto;display:flex;align-items:center;gap:9px}.brand{color:white;font:700 19px Oswald;text-transform:uppercase;margin-right:auto}.btn{border:1px solid #ffffff66;background:transparent;color:white;border-radius:8px;padding:9px 12px;font:700 11px Oswald;text-transform:uppercase}.wrap{max-width:1180px;margin:auto;padding:24px 12px 48px}h1{font:700 clamp(28px,6vw,42px) Oswald;text-transform:uppercase;margin:0 0 5px}.sub{font-size:14px;opacity:.7;margin:0 0 18px}.filters{display:flex;gap:7px;margin-bottom:12px}.filters button{border:1px solid #d6cebf;background:white;border-radius:20px;padding:8px 12px;font:700 11px Oswald;text-transform:uppercase}.filters button.active{background:var(--g);color:white}.shell{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;min-height:590px}.panel{background:white;border-radius:14px;box-shadow:0 5px 18px #2b241812;overflow:hidden}.list{padding:12px}.thread{width:100%;text-align:left;border:1px solid #e2dbcf;background:#faf8f2;border-radius:10px;padding:11px;margin:6px 0}.thread.active{border-color:var(--r);background:#fff4f0}.title{font-weight:700;font-size:13px}.person,.meta,.last{font-size:11px;margin-top:4px}.person{color:var(--g);font-weight:600}.meta{opacity:.6}.last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{display:flex;flex-direction:column}.chat-head{padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.chat-head h2{font:700 18px Oswald;text-transform:uppercase;margin:0}.customer{font-size:12px;opacity:.7;margin-top:3px}.state{font:700 10px Oswald;text-transform:uppercase;border-radius:20px;padding:5px 8px;background:#edf7ef}.state.closed{background:#eee}.messages{flex:1;min-height:380px;max-height:510px;overflow:auto;padding:18px;background:#f9f6ee}.bubble{max-width:80%;padding:10px 12px;border-radius:12px;margin:8px 0;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.staff{margin-left:auto;background:var(--g);color:white;border-bottom-right-radius:3px}.customer-msg{margin-right:auto;background:white;border:1px solid #e0d9ca;border-bottom-left-radius:3px}.who{display:block;font-size:10px;font-weight:700;opacity:.7;margin-bottom:4px;text-transform:uppercase}.time{display:block;font-size:10px;opacity:.6;margin-top:5px}.composer{padding:13px;border-top:1px solid #eee;display:flex;gap:8px}.composer textarea{flex:1;min-height:48px;max-height:120px;resize:vertical;border:1.5px solid #d7d0c4;border-radius:9px;padding:10px;font:14px 'Work Sans'}.send{border:0;background:var(--r);color:white;border-radius:9px;padding:0 17px;font:700 12px Oswald;text-transform:uppercase}.thread-actions{display:flex;gap:6px;align-items:center}.status-btn{border:0;background:var(--r);color:white;border-radius:7px;padding:7px 9px;font:700 10px Oswald;text-transform:uppercase}.open-btn{background:var(--g)}.empty{padding:24px;text-align:center;font-size:14px;opacity:.65}.msg{padding:12px;background:#fff0ed;color:#8d2e20;border-radius:9px}@media(max-width:760px){.bar{flex-wrap:wrap}.brand{width:100%}.shell{grid-template-columns:1fr;min-height:0}.messages{min-height:340px}.bubble{max-width:88%}}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="bar"><div class="brand">Campus Eats · Support</div><button id="orders" class="btn">Orders</button><button id="notifications" class="btn">Notifications</button><button id="logout" class="btn">Sign out</button></div></header><main class="wrap"><h1>Support inbox</h1><p class="sub">Customer problems and staff replies stay together as conversations.</p><div class="filters"><button data-filter="open" class="active">Open</button><button data-filter="closed">Closed</button><button data-filter="all">All</button></div><div class="shell"><aside class="panel list"><div id="threads"><div class="empty">Loading support messages…</div></div></aside><section class="panel chat"><div class="chat-head"><div><h2 id="chatTitle">Select a conversation</h2><div id="customer" class="customer"></div></div><div class="thread-actions"><span id="state" class="state" hidden></span><button id="statusBtn" class="status-btn" hidden></button></div></div><div id="messages" class="messages"><div class="empty">Select a customer conversation to reply.</div></div><div id="composer" class="composer" hidden><textarea id="reply" maxlength="2000" placeholder="Reply to the customer…"></textarea><button id="send" class="send">Send</button></div></section></div></main><script>const token=sessionStorage.getItem('campusEatsStaffToken');if(!token)location.href='staff-login.html';let current=null,filter='open',threadData=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}function renderThreads(){threads.innerHTML=threadData.map(t=>`<button class="thread ${current===t.id?'active':''}" onclick="openThread('${t.id}')"><div class="title">${esc(t.subject)}</div><div class="person">${esc(t.customer_name)}</div><div class="meta">${t.status} · ${new Date(t.updated_at).toLocaleString()}</div><div class="last">${esc(t.last_message||'No messages')}</div></button>`).join('')||'<div class="empty">No conversations in this view.</div>'}async function loadThreads(selectFirst=false){try{const d=await api('/api/support/staff/threads?status='+filter);threadData=d.threads||[];if(selectFirst&&!current&&threadData.length)current=threadData[0].id;if(current&&!threadData.some(t=>t.id===current)&&filter!=='all')current=null;renderThreads();if(current)await openThread(current,false)}catch(e){threads.innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}async function openThread(id,rerender=true){current=id;if(rerender)renderThreads();try{const d=await api('/api/support/staff/threads/'+id+'/messages');chatTitle.textContent=d.thread.subject;customer.textContent=d.thread.customer_name+' · '+d.thread.customer_email;state.hidden=false;state.textContent=d.thread.status;state.className='state '+(d.thread.status==='closed'?'closed':'');statusBtn.hidden=false;statusBtn.textContent=d.thread.status==='closed'?'Reopen':'Close';statusBtn.className='status-btn '+(d.thread.status==='closed'?'open-btn':'');composer.hidden=d.thread.status==='closed';messages.innerHTML=(d.messages||[]).map(m=>`<div class="bubble ${m.sender_type==='staff'?'staff':'customer-msg'}"><span class="who">${esc(m.sender_name||m.sender_type)}</span>${esc(m.message)}<span class="time">${new Date(m.created_at).toLocaleString()}</span></div>`).join('')||'<div class="empty">No messages.</div>';messages.scrollTop=messages.scrollHeight}catch(e){messages.innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));current=null;loadThreads(true)});send.onclick=async()=>{const m=reply.value.trim();if(!m||!current)return;send.disabled=true;try{await api('/api/support/staff/threads/'+current+'/messages',{method:'POST',body:JSON.stringify({message:m})});reply.value='';await openThread(current);await loadThreads()}catch(e){alert(e.message)}finally{send.disabled=false}};reply.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click()}});statusBtn.onclick=async()=>{if(!current)return;const next=state.textContent==='closed'?'open':'closed';try{await api('/api/support/staff/threads/'+current+'/status',{method:'POST',body:JSON.stringify({status:next})});await openThread(current);await loadThreads()}catch(e){alert(e.message)}};orders.onclick=()=>location.href='staff-dashboard.html';notifications.onclick=()=>location.href='staff-notifications.html';logout.onclick=()=>{sessionStorage.removeItem('campusEatsStaffToken');location.href='staff-login.html'};const requested=new URLSearchParams(location.search).get('thread');if(requested)current=requested;loadThreads(true);setInterval(()=>{loadThreads();if(current)openThread(current,false)},5000);</script></body></html>
