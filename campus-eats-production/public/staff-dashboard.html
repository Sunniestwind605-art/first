<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Order Dashboard — Campus Eats Staff</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Work Sans';color:var(--i)}header{position:sticky;top:0;z-index:20;background:var(--g);border-bottom:3px solid var(--y);padding:13px}.bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:10px}.brand{color:white;font:700 19px Oswald;text-transform:uppercase;margin-right:auto}.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--r);color:white;font:700 12px Oswald;text-transform:uppercase}.ghost{background:transparent;border:1px solid #ffffff66}.wrap{max-width:1200px;margin:auto;padding:24px 12px 60px}h1{font:700 clamp(28px,6vw,42px) Oswald;text-transform:uppercase;margin:0 0 6px}.sub{font-size:14px;opacity:.7;margin-bottom:20px}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:18px;scrollbar-width:none}.filters button{white-space:nowrap;border:1px solid #cec6b7;background:white;border-radius:20px;padding:8px 11px;font:600 11px Oswald;text-transform:uppercase}.filters button.active{background:var(--g);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}.card{background:white;border-radius:12px;padding:16px;border-top:4px solid var(--r);box-shadow:0 4px 13px #2b241812;min-width:0}.head{display:flex;justify-content:space-between;gap:10px}.id{font:700 16px Oswald}.status{font:700 10px Oswald;text-transform:uppercase;background:#eee;padding:5px 8px;border-radius:18px}.customer{margin:12px 0;font-weight:600}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px}.meta div{background:#f8f5ed;padding:8px;border-radius:7px}.items{margin:12px 0;padding:0;list-style:none;font-size:13px}.items li{padding:4px 0;border-bottom:1px solid #eee}.assigned{padding:9px;background:#edf7ef;border-radius:7px;font-size:12px;margin:9px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:110px;border:0;border-radius:7px;padding:10px;background:var(--g);color:white;font:700 11px Oswald;text-transform:uppercase}.actions .danger{background:var(--r)}.empty{background:white;padding:18px;border-radius:10px}.msg{padding:11px;background:#fff0ed;color:#8d2e20;border-radius:8px}@media(max-width:520px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.bar{flex-wrap:wrap}.brand{width:100%}}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="bar"><div class="brand">Campus Eats · Staff</div><button class="btn ghost" id="notify">Notifications</button><button class="btn ghost" id="refresh">Refresh</button><button class="btn" id="logout">Sign out</button></div></header><main class="wrap"><h1>Order dashboard</h1><p class="sub">Orders are assigned to the first runner who accepts. Other runners can see who took the order.</p><div class="filters" id="filters"></div><div id="out" class="grid"></div></main><script>const t=sessionStorage.getItem('campusEatsStaffToken');if(!t)location.href='staff-login.html';let filter='all';const states=['all','pending','accepted','processing','ready','delivering','delivered','cancelled'],next={accepted:'processing',processing:'ready',ready:'delivering',delivering:'delivered'};const money=c=>'R'+(Number(c||0)/100).toFixed(2),esc=s=>String(s||'').replace(/[&<>]/g,'');function renderFilters(){filters.innerHTML=states.map(s=>`<button class="${filter===s?'active':''}" onclick="setFilter('${s}')">${s}</button>`).join('')}function setFilter(s){filter=s;renderFilters();load()}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t,...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function accept(id){try{await api('/api/staff/orders/'+id+'/accept',{method:'POST'});load()}catch(e){alert(e.message)}}async function move(id,status){try{await api('/api/staff/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}async function load(){try{const d=await api('/api/staff/orders'+(filter==='all'?'':'?status='+filter));out.innerHTML=(d.orders||[]).map(o=>`<article class="card"><div class="head"><span class="id">#${o.id.slice(0,8).toUpperCase()}</span><span class="status">${o.status}</span></div><div class="customer">${esc(o.customer_name)} · ${esc(o.customer_phone)}</div><div class="meta"><div><b>Deliver to</b><br>${esc(o.building_name)}</div><div><b>Total</b><br>${money(o.total_cents)}</div><div><b>Location note</b><br>${esc(o.room_number||'—')}</div><div><b>Payment</b><br>${esc(o.payment_method)}</div></div><ul class="items">${(o.items||[]).map(i=>`<li>${i.qty}× ${esc(i.name)}</li>`).join('')}</ul>${o.accepted_by_name?`<div class="assigned">Assigned runner: <b>${esc(o.accepted_by_name)}</b></div>`:''}<div class="actions">${o.status==='pending'?`<button onclick="accept('${o.id}')">Accept order</button>`:''}${next[o.status]?`<button onclick="move('${o.id}','${next[o.status]}')">Mark ${next[o.status]}</button>`:''}${!['delivered','cancelled'].includes(o.status)?`<button class="danger" onclick="move('${o.id}','cancelled')">Cancel</button>`:''}</div></article>`).join('')||'<div class="empty">No orders in this view.</div>'}catch(e){out.innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}notify.onclick=()=>location.href='staff-notifications.html';refresh.onclick=load;logout.onclick=()=>{sessionStorage.removeItem('campusEatsStaffToken');location.href='staff-login.html'};renderFilters();load();setInterval(load,5000);</script></body></html>
