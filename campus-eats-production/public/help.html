<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Help — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Work Sans';color:var(--i)}header{background:var(--g);border-bottom:3px solid var(--y);padding:14px 18px}.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:15px}.nav a{color:white;text-decoration:none;font:600 13px Oswald;text-transform:uppercase}.nav a:first-child{font-size:20px;margin-right:auto}.wrap{max-width:1100px;margin:auto;padding:26px 14px 50px}h1{font:700 clamp(30px,7vw,44px) Oswald;text-transform:uppercase;margin:0 0 6px}.sub{font-size:14px;opacity:.72;margin:0 0 20px}.shell{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;min-height:560px}.panel{background:white;border-radius:14px;box-shadow:0 5px 18px #2b241812;overflow:hidden}.side{padding:15px}.side-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.side h2,.chat h2{font:700 18px Oswald;text-transform:uppercase;margin:0}.new{border:0;background:var(--r);color:white;border-radius:8px;padding:9px 11px;font:700 11px Oswald;text-transform:uppercase}.thread{width:100%;text-align:left;border:1px solid #e3ddd1;background:#faf8f2;border-radius:10px;padding:11px;margin:7px 0}.thread.active{border-color:var(--r);background:#fff4f0}.thread-title{font-weight:700;font-size:13px}.thread-meta{font-size:11px;opacity:.65;margin-top:4px}.last{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.chat{display:flex;flex-direction:column;min-width:0}.chat-head{padding:15px 17px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px;align-items:center}.status{font:700 10px Oswald;text-transform:uppercase;background:#edf7ef;padding:5px 8px;border-radius:20px}.status.closed{background:#eee}.messages{flex:1;min-height:360px;max-height:500px;overflow:auto;padding:18px;background:#f9f6ee}.bubble{max-width:80%;padding:10px 12px;border-radius:12px;margin:8px 0;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:var(--g);color:white;border-bottom-right-radius:3px}.staff{margin-right:auto;background:white;border:1px solid #e0d9ca;border-bottom-left-radius:3px}.who{display:block;font-size:10px;font-weight:700;opacity:.7;margin-bottom:4px;text-transform:uppercase}.time{display:block;font-size:10px;opacity:.6;margin-top:5px}.composer{padding:13px;border-top:1px solid #eee;display:flex;gap:8px}.composer textarea{flex:1;min-height:48px;max-height:120px;resize:vertical;border:1.5px solid #d7d0c4;border-radius:9px;padding:10px;font:14px 'Work Sans'}.send{border:0;background:var(--r);color:white;border-radius:9px;padding:0 16px;font:700 12px Oswald;text-transform:uppercase}.empty{padding:24px;text-align:center;font-size:14px;opacity:.7}.new-form{display:none;padding:16px;border-bottom:1px solid #eee;background:#fffaf6}.new-form.show{display:block}.new-form input,.new-form textarea{width:100%;border:1.5px solid #d7d0c4;border-radius:9px;padding:10px;margin:5px 0;font:14px 'Work Sans'}.new-form textarea{min-height:90px;resize:vertical}.new-form .actions{display:flex;gap:8px}.new-form button{border:0;border-radius:8px;padding:9px 12px;font:700 11px Oswald;text-transform:uppercase}.start{background:var(--r);color:white}.cancel{background:#eee}.close-thread{border:0;background:transparent;color:var(--r);font:700 11px Oswald;text-transform:uppercase}.msg{padding:12px;background:#fff0ed;color:#8d2e20;border-radius:9px}@media(max-width:760px){.shell{grid-template-columns:1fr;min-height:0}.messages{min-height:330px}.bubble{max-width:88%}}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="nav"><a href="index.html">Campus Eats</a><a href="menu.html">Menu</a><a href="order-tracking.html">Track</a><a href="notifications.html">Notifications</a></div></header><main class="wrap"><h1>Help & support</h1><p class="sub">Tell us what went wrong or what you need help with. A Campus Eats staff member can reply in this conversation.</p><div class="shell"><aside class="panel side"><div class="side-head"><h2>Conversations</h2><button id="newBtn" class="new">New</button></div><div id="threads"><div class="empty">Loading…</div></div></aside><section class="panel chat"><div id="newForm" class="new-form"><input id="subject" maxlength="160" placeholder="What do you need help with?"><textarea id="firstMessage" maxlength="2000" placeholder="Describe the problem"></textarea><div class="actions"><button id="startBtn" class="start">Start conversation</button><button id="cancelBtn" class="cancel">Cancel</button></div></div><div id="chatHead" class="chat-head"><div><h2 id="chatTitle">Select a conversation</h2><small id="chatCustomer"></small></div><div><span id="chatStatus" class="status" hidden></span><button id="closeThread" class="close-thread" hidden>Close issue</button></div></div><div id="messages" class="messages"><div class="empty">Choose a conversation or start a new one.</div></div><div id="composer" class="composer" hidden><textarea id="reply" maxlength="2000" placeholder="Type your message…"></textarea><button id="send" class="send">Send</button></div></section></div></main><script>const token=localStorage.getItem('campusEatsToken');if(!token){localStorage.setItem('campusEatsReturnTo','help.html');location.href='login.html'}let current=null,threadData=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}function renderThreads(){threads.innerHTML=threadData.map(t=>`<button class="thread ${current===t.id?'active':''}" onclick="openThread('${t.id}')"><div class="thread-title">${esc(t.subject)}</div><div class="thread-meta">${t.status} · ${new Date(t.updated_at).toLocaleString()}</div><div class="last">${esc(t.last_message||'No messages yet')}</div></button>`).join('')||'<div class="empty">No support conversations yet.</div>'}async function loadThreads(selectFirst=false){try{const d=await api('/api/support/threads');threadData=d.threads||[];if(selectFirst&&!current&&threadData.length)current=threadData[0].id;renderThreads();if(current)await openThread(current,false)}catch(e){threads.innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}async function openThread(id,rerender=true){current=id;if(rerender)renderThreads();try{const d=await api('/api/support/threads/'+id+'/messages');chatTitle.textContent=d.thread.subject;chatStatus.hidden=false;chatStatus.textContent=d.thread.status;chatStatus.className='status '+(d.thread.status==='closed'?'closed':'');closeThread.hidden=d.thread.status==='closed';composer.hidden=d.thread.status==='closed';messages.innerHTML=(d.messages||[]).map(m=>`<div class="bubble ${m.sender_type==='customer'?'mine':'staff'}"><span class="who">${esc(m.sender_name||m.sender_type)}</span>${esc(m.message)}<span class="time">${new Date(m.created_at).toLocaleString()}</span></div>`).join('')||'<div class="empty">No messages yet.</div>';messages.scrollTop=messages.scrollHeight}catch(e){messages.innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}newBtn.onclick=()=>newForm.classList.add('show');cancelBtn.onclick=()=>newForm.classList.remove('show');startBtn.onclick=async()=>{const s=subject.value.trim(),m=firstMessage.value.trim();if(!s||!m)return alert('Enter a subject and message.');startBtn.disabled=true;try{const d=await api('/api/support/threads',{method:'POST',body:JSON.stringify({subject:s,message:m})});subject.value='';firstMessage.value='';newForm.classList.remove('show');current=d.thread.id;await loadThreads();await openThread(current)}catch(e){alert(e.message)}finally{startBtn.disabled=false}};send.onclick=async()=>{const m=reply.value.trim();if(!m||!current)return;send.disabled=true;try{await api('/api/support/threads/'+current+'/messages',{method:'POST',body:JSON.stringify({message:m})});reply.value='';await openThread(current);await loadThreads()}catch(e){alert(e.message)}finally{send.disabled=false}};reply.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click()}});closeThread.onclick=async()=>{if(!current||!confirm('Close this support conversation?'))return;try{await api('/api/support/threads/'+current+'/close',{method:'POST'});await openThread(current);await loadThreads()}catch(e){alert(e.message)}};const requested=new URLSearchParams(location.search).get('thread');if(requested)current=requested;loadThreads(true);setInterval(()=>{loadThreads();if(current)openThread(current,false)},5000);</script></body></html>
