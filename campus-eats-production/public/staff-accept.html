<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Accept Order — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--hunter:#1F3823;--brick:#A8412C;--parchment:#EFE9DA;--gold:#C9A227;--ink:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--parchment);font-family:'Work Sans';color:var(--ink)}header{background:var(--hunter);color:white;padding:16px 18px;border-bottom:3px solid var(--gold);font-family:'Oswald';font-size:21px;font-weight:700}.wrap{max-width:560px;margin:auto;padding:24px 14px}.card{background:white;border-radius:16px;padding:24px;box-shadow:0 12px 35px rgba(43,36,24,.13)}h1{font-family:'Oswald';text-transform:uppercase;font-size:34px}.row,.item{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid #eee}.notice{padding:12px;border-radius:9px;background:#f6f2e8;margin:14px 0}.accept{width:100%;min-height:52px;border:0;border-radius:9px;background:var(--brick);color:white;font-family:'Oswald';font-size:17px;font-weight:700}.msg{display:none;padding:13px;border-radius:9px;margin-top:14px}.msg.show{display:block}.ok{background:#edf7ef;color:#24562d}.err{background:#fff0ed;color:#8d2e20}</style><link rel="stylesheet" href="mobile.css"></head><body><header>Campus Eats · Staff Order</header><main class="wrap"><section class="card"><h1>Accept order</h1><div id="loading">Loading order…</div><div id="details" hidden><div class="row"><span>Order</span><b id="orderId"></b></div><div class="row"><span>Deliver to</span><b id="building"></b></div><div class="row"><span>Location note</span><b id="room"></b></div><div class="row"><span>Total</span><b id="total"></b></div><div id="items"></div><div class="notice" id="notice"></div><button id="acceptBtn" class="accept">Accept this order</button></div><div class="msg ok" id="ok"></div><div class="msg err" id="err"></div></section></main><script>const token=new URLSearchParams(location.search).get('token')||'',load=document.getElementById('loading'),details=document.getElementById('details'),ok=document.getElementById('ok'),err=document.getElementById('err'),btn=document.getElementById('acceptBtn');async function init(){if(!token){load.textContent='This acceptance link is invalid.';return}try{const r=await fetch('/api/staff/invite/'+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw new Error(d.error);const x=d.invite;load.hidden=true;details.hidden=false;orderId.textContent='CE-'+x.order_id.slice(0,8).toUpperCase();building.textContent=x.building_name;room.textContent=x.room_number||'No extra note';total.textContent='R'+(x.total_cents/100).toFixed(2);items.innerHTML=(x.items||[]).map(i=>'<div class="item"><span>'+String(i.item_name).replace(/[&<>]/g,'')+'</span><b>×'+i.quantity+'</b></div>').join('');if(x.status!=='pending'||x.expired){btn.disabled=true;notice.textContent=x.accepted_by_name?'Already accepted by '+x.accepted_by_name+'.':(x.expired?'This acceptance link expired.':'Order is '+x.status+'.')}else notice.textContent='Assigned to '+x.staff_name+'. The first staff member to accept becomes its runner.'}catch(e){load.textContent=e.message}}btn.onclick=async()=>{btn.disabled=true;try{const r=await fetch('/api/staff/invite/'+encodeURIComponent(token)+'/accept',{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(d.error);ok.textContent='Order accepted by '+d.acceptedBy+'. Other staff and the customer are being updated.';ok.classList.add('show');notice.textContent='You are now assigned to this order.'}catch(e){err.textContent=e.message;err.classList.add('show');btn.disabled=false}};init();</script></body></html>
