<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign In — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Work Sans';color:var(--i)}header{background:var(--g);border-bottom:3px solid var(--y);padding:15px 18px}.nav{max-width:980px;margin:auto;display:flex;justify-content:space-between}.nav a{color:white;text-decoration:none;font:700 18px Oswald}.nav a:last-child{color:var(--y);font-size:14px}.wrap{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px 12px}.card{width:min(100%,430px);background:white;border-radius:15px;padding:28px 24px;box-shadow:0 10px 30px #2b24181c;border-top:5px solid var(--r)}h1{font:700 32px Oswald;text-transform:uppercase;margin:4px 0 8px}.sub{font-size:14px;line-height:1.55;opacity:.75;margin-bottom:20px}label{display:block;font:600 12px Oswald;text-transform:uppercase;color:var(--g);margin:14px 0 6px}input{width:100%;padding:13px;border:1.5px solid #d7d0c4;border-radius:9px;background:#faf8f2;font-size:16px}.btn{width:100%;min-height:48px;margin-top:18px;border:0;border-radius:9px;background:var(--r);color:white;font:700 15px Oswald;text-transform:uppercase}.msg{display:none;margin:12px 0;padding:11px;border-radius:8px;background:#fff0ed;color:#8d2e20;font-size:13px}.msg.show{display:block}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="nav"><a href="index.html">Campus Eats</a><a href="register.html">Create account</a></div></header><main class="wrap"><section class="card"><h1>Sign in</h1><p class="sub">Enter the verified email address linked to your Campus Eats account.</p><div id="err" class="msg"></div><form id="f"><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="student@students.wits.ac.za" required><label>Password</label><input id="pass" type="password" autocomplete="current-password" required><button id="submit" class="btn">Sign in</button></form><p style="text-align:center;font-size:13px">New to Campus Eats? <a href="register.html" style="color:var(--r);font-weight:600">Create account</a></p></section></main><script>const f=document.getElementById('f'),err=document.getElementById('err');function bad(m){err.textContent=m;err.classList.add('show')}f.onsubmit=async e=>{e.preventDefault();err.classList.remove('show');submit.disabled=true;const em=email.value.trim().toLowerCase();try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pass.value,as:'customer'})}),d=await r.json();if(!r.ok){if(d.verificationRequired&&d.customerId){localStorage.setItem('campusEatsPendingVerification',JSON.stringify({customerId:d.customerId,email:d.email||em}));location.href='verify.html';return}throw new Error(d.error||'Sign in failed')}localStorage.setItem('campusEatsToken',d.token);localStorage.setItem('campusEatsCurrentUser',JSON.stringify({id:d.customer.id,fullName:d.customer.full_name,phone:d.customer.phone,email:d.customer.email}));const next=localStorage.getItem('campusEatsReturnTo')||'menu.html';localStorage.removeItem('campusEatsReturnTo');location.href=next}catch(x){bad(x.message)}finally{submit.disabled=false}};</script></body></html>
