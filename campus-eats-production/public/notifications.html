<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Enable Notifications — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--p);font-family:'Work Sans';color:var(--i);display:grid;place-items:center;padding:18px}.card{width:min(100%,460px);background:white;border-radius:16px;padding:28px 24px;border-top:5px solid var(--y);box-shadow:0 10px 30px #2b24181c}h1{font:700 31px Oswald;text-transform:uppercase;margin:0 0 8px;color:var(--g)}p{line-height:1.55;font-size:14px}.note{background:#f7f2e5;border-radius:9px;padding:12px;margin:15px 0}.btn{width:100%;min-height:49px;border:0;border-radius:9px;background:var(--r);color:white;font:700 14px Oswald;text-transform:uppercase;margin-top:10px}.skip{background:transparent;color:var(--g);border:1px solid #bdb4a3}.msg{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#fff0ed;color:#8d2e20;font-size:13px}.msg.show{display:block}</style></head><body><main class="card"><h1>Order alerts</h1><p>Campus Eats can send free browser notifications when a runner accepts your order and whenever its delivery status changes.</p><div class="note"><b>Recommended:</b> enable notifications on the phone or computer you normally use for Campus Eats. You can still track orders on the website if you skip this.</div><div id="err" class="msg"></div><button id="enable" class="btn">Enable notifications</button><button id="skip" class="btn skip">Continue without notifications</button></main><script src="push-client.js"></script><script>if(!localStorage.getItem('campusEatsToken'))location.href='login.html';const next=()=>{const n=localStorage.getItem('campusEatsAfterNotifications')||'menu.html';localStorage.removeItem('campusEatsAfterNotifications');location.href=n};enable.onclick=async()=>{enable.disabled=true;try{await CampusEatsPush.enableCustomer();next()}catch(e){err.textContent=e.message;err.classList.add('show');enable.disabled=false}};skip.onclick=next;</script></body></html>
