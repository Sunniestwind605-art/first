<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Runner Notifications — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--g);font-family:'Work Sans';display:grid;place-items:center;padding:18px;color:var(--i)}.card{width:min(100%,470px);background:white;border-radius:16px;padding:28px 24px;border-top:5px solid var(--y)}h1{font:700 30px Oswald;text-transform:uppercase;margin:0 0 8px}p{font-size:14px;line-height:1.5}label{display:block;font:600 12px Oswald;text-transform:uppercase;margin:16px 0 6px}select{width:100%;padding:13px;border:1.5px solid #d7d0c4;border-radius:9px;background:#faf8f2;font-size:16px}.btn{width:100%;min-height:49px;border:0;border-radius:9px;background:var(--r);color:white;font:700 14px Oswald;text-transform:uppercase;margin-top:15px}.ghost{background:transparent;color:var(--g);border:1px solid #bdb4a3}.msg{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#fff0ed;color:#8d2e20;font-size:13px}.msg.show{display:block}</style></head><body><main class="card"><h1>Runner notifications</h1><p>Choose who is using this device. New orders will be pushed to this browser with your own secure acceptance link.</p><label>Runner</label><select id="runner"><option value="">Loading runners…</option></select><div id="err" class="msg"></div><button id="enable" class="btn">Enable runner notifications</button><button id="skip" class="btn ghost">Open dashboard without notifications</button></main><script src="push-client.js"></script><script>const token=sessionStorage.getItem('campusEatsStaffToken');if(!token)location.href='staff-login.html';async function load(){try{const d=await CampusEatsPush.api('/api/push/staff-directory',{token});runner.innerHTML='<option value="">Choose your name</option>'+(d.staff||[]).map(s=>`<option value="${s.id}">${s.full_name}</option>`).join('');const saved=localStorage.getItem('campusEatsRunnerId');if(saved)runner.value=saved}catch(e){err.textContent=e.message;err.classList.add('show')}}enable.onclick=async()=>{err.classList.remove('show');if(!runner.value){err.textContent='Choose your runner name first.';err.classList.add('show');return}enable.disabled=true;try{await CampusEatsPush.enableStaff(runner.value);location.href='staff-dashboard.html'}catch(e){err.textContent=e.message;err.classList.add('show');enable.disabled=false}};skip.onclick=()=>location.href='staff-dashboard.html';load();</script></body></html>
