<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Create Account — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Work Sans';color:var(--i)}header{background:var(--g);border-bottom:3px solid var(--y);padding:15px 18px}.nav{max-width:980px;margin:auto;display:flex;justify-content:space-between}.nav a{color:white;text-decoration:none;font:700 18px Oswald}.nav a:last-child{color:var(--y);font-size:14px}.wrap{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px 12px}.card{width:min(100%,460px);background:white;border-radius:15px;padding:28px 24px;box-shadow:0 10px 30px #2b24181c;border-top:5px solid var(--r)}h1{font:700 32px Oswald;text-transform:uppercase;margin:4px 0 8px}.sub{font-size:14px;line-height:1.55;opacity:.75;margin-bottom:20px}label{display:block;font:600 12px Oswald;text-transform:uppercase;color:var(--g);margin:14px 0 6px}input{width:100%;padding:13px;border:1.5px solid #d7d0c4;border-radius:9px;background:#faf8f2;font-size:16px}.consent{display:flex;gap:10px;align-items:flex-start;margin:18px 0;font-size:13px;line-height:1.5}.consent input{width:19px;height:19px;flex:0 0 auto}.btn{width:100%;min-height:48px;border:0;border-radius:9px;background:var(--r);color:white;font:700 15px Oswald;text-transform:uppercase}.msg{display:none;margin:12px 0;padding:11px;border-radius:8px;font-size:13px}.msg.show{display:block}.bad{background:#fff0ed;color:#8d2e20}.ok{background:#edf7ef;color:#24562d}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="nav"><a href="index.html">Campus Eats</a><a href="login.html">Sign in</a></div></header><main class="wrap"><section class="card"><h1>Create account</h1><p class="sub">Register with the WhatsApp number you want Campus Eats to use for verification and order updates.</p><div id="err" class="msg bad"></div><div id="ok" class="msg ok"></div><form id="f"><label>Full name</label><input id="name" autocomplete="name" required><label>WhatsApp phone number</label><input id="phone" type="tel" inputmode="tel" placeholder="0721234567" autocomplete="tel" required><label>Password</label><input id="pass" type="password" minlength="8" autocomplete="new-password" required><label>Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><label class="consent"><input id="consent" type="checkbox" required><span>I agree to receive essential Campus Eats WhatsApp messages for account verification and order updates.</span></label><button class="btn" id="submit">Create account</button></form><p style="text-align:center;font-size:13px">Already registered? <a href="login.html" style="color:var(--r);font-weight:600">Sign in</a></p></section></main><script>const f=document.getElementById('f'),err=document.getElementById('err'),ok=document.getElementById('ok');function show(el,m){err.classList.remove('show');ok.classList.remove('show');el.textContent=m;el.classList.add('show')}f.onsubmit=async e=>{e.preventDefault();const fullName=name.value.trim(),p=phone.value.trim(),password=pass.value;if(password!==confirm.value)return show(err,'Passwords do not match.');if(password.length<8)return show(err,'Password must be at least 8 characters.');if(!consent.checked)return show(err,'WhatsApp consent is required for verification and service updates.');submit.disabled=true;try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName,phone:p,password,whatsappOptIn:true})}),d=await r.json();if(!r.ok){if(d.verificationRequired&&d.customerId){localStorage.setItem('campusEatsPendingVerification',JSON.stringify({customerId:d.customerId,phone:p}));location.href='verify.html';return}throw new Error(d.error||'Registration failed')}localStorage.setItem('campusEatsPendingVerification',JSON.stringify({customerId:d.customerId,phone:d.phone||p}));show(ok,'Account created. Check WhatsApp for your verification code.');setTimeout(()=>location.href='verify.html',350)}catch(x){show(err,x.message)}finally{submit.disabled=false}};</script></body></html>
