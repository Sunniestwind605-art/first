<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Create Account — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Work Sans';color:var(--i)}header{background:var(--g);border-bottom:3px solid var(--y);padding:15px 18px}.nav{max-width:980px;margin:auto;display:flex;justify-content:space-between}.nav a{color:white;text-decoration:none;font:700 18px Oswald}.nav a:last-child{color:var(--y);font-size:14px}.wrap{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px 12px}.card{width:min(100%,460px);background:white;border-radius:15px;padding:28px 24px;box-shadow:0 10px 30px #2b24181c;border-top:5px solid var(--r)}h1{font:700 32px Oswald;text-transform:uppercase;margin:4px 0 8px}.sub{font-size:14px;line-height:1.55;opacity:.75;margin-bottom:20px}label{display:block;font:600 12px Oswald;text-transform:uppercase;color:var(--g);margin:14px 0 6px}input{width:100%;padding:13px;border:1.5px solid #d7d0c4;border-radius:9px;background:#faf8f2;font-size:16px}.btn{width:100%;min-height:48px;border:0;border-radius:9px;background:var(--r);color:white;font:700 15px Oswald;text-transform:uppercase;margin-top:18px}.msg{display:none;margin:12px 0;padding:11px;border-radius:8px;font-size:13px}.msg.show{display:block}.bad{background:#fff0ed;color:#8d2e20}.ok{background:#edf7ef;color:#24562d}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="nav"><a href="index.html">Campus Eats</a><a href="login.html">Sign in</a></div></header><main class="wrap"><section class="card"><h1>Create account</h1><p class="sub">Use your email to sign in. Your phone number is kept for delivery contact. Order updates are sent through free browser notifications when you enable them.</p><div id="err" class="msg bad"></div><form id="f"><label>Full name</label><input id="name" autocomplete="name" required><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="student@students.wits.ac.za" required><label>Phone number</label><input id="phone" type="tel" inputmode="tel" placeholder="0721234567" autocomplete="tel" required><label>Password</label><input id="pass" type="password" minlength="8" autocomplete="new-password" required><label>Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button class="btn" id="submit">Create account</button></form><p style="text-align:center;font-size:13px">Already registered? <a href="login.html" style="color:var(--r);font-weight:600">Sign in</a></p></section></main><script>const f=document.getElementById('f'),err=document.getElementById('err');function show(m){err.textContent=m;err.classList.add('show')}f.onsubmit=async e=>{e.preventDefault();err.classList.remove('show');const fullName=name.value.trim(),em=email.value.trim().toLowerCase(),p=phone.value.trim(),password=pass.value;if(password!==confirm.value)return show('Passwords do not match.');if(password.length<8)return show('Password must be at least 8 characters.');submit.disabled=true;try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName,email:em,phone:p,password})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Registration failed');localStorage.setItem('campusEatsToken',d.token);localStorage.setItem('campusEatsCurrentUser',JSON.stringify({id:d.customer.id,fullName:d.customer.full_name,phone:d.customer.phone,email:d.customer.email}));location.href='menu.html'}catch(x){show(x.message)}finally{submit.disabled=false}};</script></body></html>
