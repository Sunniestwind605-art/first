<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Track Order — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Work Sans';color:var(--i)}header{background:var(--g);border-bottom:3px solid var(--y);padding:15px 18px}.nav{max-width:980px;margin:auto;display:flex;gap:16px}.nav a{color:white;text-decoration:none;font:600 14px Oswald}.nav a:first-child{font-size:19px;margin-right:auto}.wrap{max-width:820px;margin:auto;padding:32px 14px 60px}h1{font:700 clamp(30px,7vw,44px) Oswald;text-transform:uppercase}.card{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #2b241812}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.id{font:700 18px Oswald}.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#eee;font:700 11px Oswald;text-transform:uppercase}.pending{background:#fff0c6}.accepted,.processing{background:#dce8ff}.ready{background:#e5f4e9}.delivering{background:#e8def9}.delivered{background:#d8f0df}.cancelled{background:#f5d8d2}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.meta div{background:#f8f5ed;padding:11px;border-radius:8px}.meta small{display:block;text-transform:uppercase;font:600 10px Oswald;color:#756c5e;margin-bottom:4px}.msg{padding:13px;border-radius:9px;background:#fff7df}.extra{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.small{border:0;border-radius:8px;padding:9px 12px;background:var(--g);color:white;font:600 12px Oswald;text-transform:uppercase}.review{margin-top:16px;border-top:1px solid #eee;padding-top:14px}.review h3{font:700 16px Oswald;text-transform:uppercase;margin:0 0 8px}.stars{display:flex;gap:4px;margin:8px 0}.star{border:0;background:transparent;font-size:30px;line-height:1;color:#b9ad97;padding:0 2px;min-height:36px}.star.on{color:var(--y)}.review textarea{width:100%;min-height:84px;border:1.5px solid #d7d0c4;border-radius:9px;padding:10px;font:14px 'Work Sans';resize:vertical}.review .send{border:0;border-radius:8px;background:var(--r);color:white;padding:10px 14px;font:700 12px Oswald;text-transform:uppercase;margin-top:8px}.saved-review{background:#f4f8f0;padding:12px;border-radius:9px;font-size:14px;line-height:1.5}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:200;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{width:min(100%,760px);background:white;border-radius:12px;padding:12px}.modal-box img{display:block;width:100%;max-height:75vh;object-fit:contain;border-radius:8px}.modal-close{width:100%;border:0;background:var(--r);color:white;border-radius:8px;padding:10px;margin-top:10px;font:700 12px Oswald;text-transform:uppercase}@media(max-width:560px){.meta{grid-template-columns:1fr}.head{flex-direction:column}}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="nav"><a href="index.html">Campus Eats</a><a href="menu.html">Menu</a><a href="help.html">Help</a><a href="login.html">Account</a></div></header><main class="wrap"><h1>Track your order</h1><p>Live status comes directly from the Campus Eats backend. If you enabled browser notifications, important status changes can also appear on that device.</p><div id="out"><div class="msg">Loading your orders…</div></div></main><div id="photoModal" class="modal"><div class="modal-box"><img id="photoImg" alt="Delivery surroundings photo"><button id="photoClose" class="modal-close">Close photo</button></div></div><script>const token=localStorage.getItem('campusEatsToken');const money=c=>'R'+(Number(c||0)/100).toFixed(2),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token)location.href='login.html';let ratings={};function stars(id,rating){return[1,2,3,4,5].map(n=>`<button class="star ${n<=rating?'on':''}" onclick="setRating('${id}',${n})" aria-label="${n} star${n>1?'s':''}">★</button>`).join('')}function setRating(id,n){ratings[id]=n;document.getElementById('stars-'+id).innerHTML=stars(id,n)}async function submitReview(id){const rating=ratings[id]||0,comment=document.getElementById('comment-'+id).value.trim();if(!rating)return alert('Choose a star rating first.');try{const r=await fetch('/api/orders/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({rating,comment})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not save review');await load()}catch(e){alert(e.message)}}async function viewPhoto(id){try{const r=await fetch('/api/orders/'+id+'/photo',{headers:{Authorization:'Bearer '+token}});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Could not load photo')}const blob=await r.blob();photoImg.src=URL.createObjectURL(blob);photoModal.classList.add('show')}catch(e){alert(e.message)}}photoClose.onclick=()=>{if(photoImg.src.startsWith('blob:'))URL.revokeObjectURL(photoImg.src);photoImg.removeAttribute('src');photoModal.classList.remove('show')};photoModal.onclick=e=>{if(e.target===photoModal)photoClose.click()};async function load(){try{const r=await fetch('/api/orders',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load orders');out.innerHTML=(d.orders||[]).map(o=>{const reviewed=o.review_rating!==null&&o.review_rating!==undefined;const reviewHtml=o.status==='delivered'?(reviewed?`<div class="review"><h3>Your review</h3><div class="saved-review"><b>${'★'.repeat(Number(o.review_rating))}${'☆'.repeat(5-Number(o.review_rating))}</b>${o.review_comment?`<br>${esc(o.review_comment)}`:''}</div></div>`:`<div class="review"><h3>How was this order?</h3><p style="font-size:13px;margin:4px 0">Leave one review after delivery.</p><div id="stars-${o.id}" class="stars">${stars(o.id,ratings[o.id]||0)}</div><textarea id="comment-${o.id}" maxlength="800" placeholder="Optional comment about the service, delivery or experience"></textarea><button class="send" onclick="submitReview('${o.id}')">Submit review</button></div>`):'';return`<article class="card"><div class="head"><div><div class="id">#${o.id.slice(0,8).toUpperCase()}</div><small>${new Date(o.created_at).toLocaleString()}</small></div><span class="status ${o.status}">${o.status}</span></div><div class="meta"><div><small>Deliver to</small>${esc(o.building_name)}</div><div><small>Runner</small>${esc(o.accepted_by_name||'Waiting for acceptance')}</div><div><small>Total</small>${money(o.total_cents)}</div><div><small>Last updated</small>${new Date(o.updated_at).toLocaleTimeString()}</div></div>${o.has_delivery_photo?`<div class="extra"><button class="small" onclick="viewPhoto('${o.id}')">View surroundings photo</button></div>`:''}${reviewHtml}</article>`}).join('')||'<div class="msg">No orders yet. <a href="menu.html">Order from Tubatsi.</a></div>'}catch(e){out.innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}load();setInterval(load,5000);</script></body></html>
