<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Track Order — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--g:#1F3823;--r:#A8412C;--p:#EFE9DA;--y:#C9A227;--i:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Work Sans';color:var(--i)}header{background:var(--g);border-bottom:3px solid var(--y);padding:15px 18px}.nav{max-width:980px;margin:auto;display:flex;gap:16px}.nav a{color:white;text-decoration:none;font:600 14px Oswald}.nav a:first-child{font-size:19px;margin-right:auto}.wrap{max-width:780px;margin:auto;padding:32px 14px 60px}h1{font:700 clamp(30px,7vw,44px) Oswald;text-transform:uppercase}.card{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #2b241812}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.id{font:700 18px Oswald}.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#eee;font:700 11px Oswald;text-transform:uppercase}.pending{background:#fff0c6}.accepted,.processing{background:#dce8ff}.ready{background:#e5f4e9}.delivering{background:#e8def9}.delivered{background:#d8f0df}.cancelled{background:#f5d8d2}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.meta div{background:#f8f5ed;padding:11px;border-radius:8px}.meta small{display:block;text-transform:uppercase;font:600 10px Oswald;color:#756c5e;margin-bottom:4px}.events{margin-top:15px;padding-left:18px}.events li{margin:8px 0}.msg{padding:13px;border-radius:9px;background:#fff7df}@media(max-width:560px){.meta{grid-template-columns:1fr}.head{flex-direction:column}}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="nav"><a href="index.html">Campus Eats</a><a href="menu.html">Menu</a><a href="login.html">Account</a></div></header><main class="wrap"><h1>Track your order</h1><p>Live status comes from the Campus Eats backend. WhatsApp updates are sent at the same status changes once the WhatsApp sender is connected.</p><div id="out"><div class="msg">Loading your orders…</div></div></main><script>const token=localStorage.getItem('campusEatsToken'),last=localStorage.getItem('campusEatsLastOrderId');const money=c=>'R'+(Number(c||0)/100).toFixed(2),esc=s=>String(s||'').replace(/[&<>]/g,'');if(!token)location.href='login.html';async function load(){try{const r=await fetch('/api/orders',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load orders');out.innerHTML=(d.orders||[]).map(o=>`<article class="card"><div class="head"><div><div class="id">#${o.id.slice(0,8).toUpperCase()}</div><small>${new Date(o.created_at).toLocaleString()}</small></div><span class="status ${o.status}">${o.status}</span></div><div class="meta"><div><small>Deliver to</small>${esc(o.building_name)}</div><div><small>Runner</small>${esc(o.accepted_by_name||'Waiting for acceptance')}</div><div><small>Total</small>${money(o.total_cents)}</div><div><small>Last updated</small>${new Date(o.updated_at).toLocaleTimeString()}</div></div></article>`).join('')||'<div class="msg">No orders yet. <a href="menu.html">Order from Tubatsi.</a></div>'}catch(e){out.innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}load();setInterval(load,5000);</script></body></html>
