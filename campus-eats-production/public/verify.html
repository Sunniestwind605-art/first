<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Verify Email — Campus Eats</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--hunter:#1F3823;--brick:#A8412C;--parchment:#EFE9DA;--gold:#C9A227;--ink:#2B2418}*{box-sizing:border-box}body{margin:0;background:var(--parchment);font-family:'Work Sans',sans-serif;color:var(--ink)}header{background:var(--hunter);color:white;border-bottom:3px solid var(--gold)}.nav{max-width:1080px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between}.brand{font-family:'Oswald';font-size:21px;font-weight:700;color:white;text-decoration:none}.back{color:var(--gold);font-weight:600;text-decoration:none}.wrap{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:24px 14px}.card{width:min(100%,460px);background:#fff;padding:30px;border-radius:16px;box-shadow:0 12px 35px rgba(43,36,24,.12);border-top:5px solid var(--brick)}h1{font-family:'Oswald';text-transform:uppercase;font-size:34px}.code{width:100%;font-size:28px;letter-spacing:8px;text-align:center;padding:14px;border:2px solid #d8d0c3;border-radius:10px}.code:focus{border-color:var(--hunter)}button{width:100%;min-height:48px;margin-top:14px;border-radius:9px;font-family:'Oswald';font-weight:700;text-transform:uppercase}.primary{background:var(--brick);color:white;border:0}.secondary{background:transparent;border:1.5px solid var(--hunter);color:var(--hunter)}.msg{display:none;margin-top:14px;padding:12px;border-radius:8px}.msg.show{display:block}.err{background:#fff0ed;color:#8d2e20}.ok{background:#edf7ef;color:#24562d}</style><link rel="stylesheet" href="mobile.css"></head><body><header><div class="nav"><a class="brand" href="index.html">Campus Eats</a><a class="back" href="login.html">Sign in</a></div></header><main class="wrap"><section class="card"><h1>Verify your email</h1><p>We sent a 6-digit Campus Eats verification code to <b id="emailLabel">your email address</b>.</p><div class="msg err" id="error"></div><div class="msg ok" id="success"></div><form id="verifyForm"><input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required><button class="primary" id="verifyBtn" type="submit">Verify account</button></form><button class="secondary" id="resendBtn" type="button">Resend email</button></section></main><script>const pending=JSON.parse(localStorage.getItem('campusEatsPendingVerification')||'null');if(!pending?.customerId)location.href='register.html';document.getElementById('emailLabel').textContent=pending?.email||'your email address';const err=document.getElementById('error'),ok=document.getElementById('success');function show(el,msg){err.classList.remove('show');ok.classList.remove('show');el.textContent=msg;el.classList.add('show')}document.getElementById('verifyForm').addEventListener('submit',async e=>{e.preventDefault();const code=document.getElementById('code').value.replace(/\D/g,'');if(code.length!==6){show(err,'Enter the 6-digit code from your email.');return}const btn=document.getElementById('verifyBtn');btn.disabled=true;try{const r=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:pending.customerId,code})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Verification failed');localStorage.setItem('campusEatsToken',data.token);localStorage.setItem('campusEatsCurrentUser',JSON.stringify({id:data.customer.id,fullName:data.customer.full_name,phone:data.customer.phone,email:data.customer.email}));localStorage.removeItem('campusEatsPendingVerification');show(ok,'Email verified. Redirecting…');setTimeout(()=>{const next=localStorage.getItem('campusEatsReturnTo')||'index.html';localStorage.removeItem('campusEatsReturnTo');location.href=next},500)}catch(e){show(err,e.message)}finally{btn.disabled=false}});document.getElementById('resendBtn').addEventListener('click',async()=>{try{const r=await fetch('/api/auth/resend-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:pending.customerId})});const d=await r.json();if(!r.ok)throw new Error(d.error);show(ok,'A new verification email has been requested.')}catch(e){show(err,e.message)}});</script></body></html>
